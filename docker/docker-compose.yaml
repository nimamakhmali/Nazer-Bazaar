version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: price_monitor_db
    environment:
      POSTGRES_DB: ${DB_NAME:-price_monitoring}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: price_monitor_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django ─────────────────────────────────────────────────────────────
  django:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile
    container_name: price_monitor_app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ─── Celery Worker ──────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile
    container_name: price_monitor_celery
    command: celery -A config worker -l info -c 4
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - django
      - redis

  # ─── Celery Beat ────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile
    container_name: price_monitor_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - django
      - redis

  # ─── Nginx ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: price_monitor_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - django

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: