version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: price_monitor_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-price_monitoring}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: price_monitor_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Django
  # ---------------------------------------------------------------------------
  django:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile

    container_name: price_monitor_app
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: postgres
      PYTHONUNBUFFERED: "1"

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
      "

    ports:
      - "8000:8000"

    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile

    container_name: price_monitor_celery
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: postgres
      PYTHONUNBUFFERED: "1"

    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=4

    volumes:
      - ..:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Celery Beat
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile

    container_name: price_monitor_beat
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: postgres
      PYTHONUNBUFFERED: "1"

    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

    volumes:
      - ..:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------------------------
