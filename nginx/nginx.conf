# ─────────────────────────────────────────────────────────────
# فایل: nginx/nginx.conf
# ─────────────────────────────────────────────────────────────

upstream pricemonitor_backend {
    server backend:8000;
    keepalive 32;
}

upstream pricemonitor_frontend {
    server frontend:3000;
    keepalive 16;
}

# محدودیت سایز فایل آپلود (مدارک، تصاویر)
client_max_body_size 20M;

# بافرها
client_body_buffer_size 128k;
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 32k;

server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ─── فایل‌های استاتیک جنگو ────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        tcp_nodelay off;
        sendfile on;
    }

    # ─── فایل‌های مدیا (تصاویر، مدارک) ───────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        sendfile on;
    }

    # ─── Django REST API ───────────────────────────────────
    location /api/ {
        proxy_pass http://pricemonitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── Django Admin ──────────────────────────────────────
    location /admin/ {
        proxy_pass http://pricemonitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── API Schema / Docs ─────────────────────────────────
    location /api/schema/ {
        proxy_pass http://pricemonitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/docs/ {
        proxy_pass http://pricemonitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/redoc/ {
        proxy_pass http://pricemonitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Next.js: فایل‌های استاتیک /_next/ ────────────────
    location /_next/static/ {
        proxy_pass http://pricemonitor_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Next.js: HMR (فقط dev، در prod بی‌اثر) ──────────
    location /_next/webpack-hmr {
        proxy_pass http://pricemonitor_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ─── Next.js Frontend (همه چیز دیگر) ─────────────────
    location / {
        proxy_pass http://pricemonitor_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # برای WebSocket (Next.js dev server)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Error Pages ───────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error": "سرویس موقتاً در دسترس نیست"}';
        add_header Content-Type "application/json; charset=utf-8";
    }
}