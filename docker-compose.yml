# ─────────────────────────────────────────────────────────────
# فایل: docker-compose.yml
# پروژه: سامانه پایش قیمت کالا
# پورت خروجی: 8090 (آزاد روی سرور)
# ─────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pricemonitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pricemonitor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pricemonitor_net
    # توجه: هیچ پورتی expose نشده به بیرون

  # ─────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pricemonitor_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - pricemonitor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pricemonitor_net
    # توجه: هیچ پورتی expose نشده به بیرون

  # ─────────────────────────────────────────────────────────
  # Django Backend (Gunicorn)
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricemonitor_backend
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: web
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - pricemonitor_static:/app/staticfiles
      - pricemonitor_media:/app/media
      - pricemonitor_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pricemonitor_net
    # توجه: پورت 8000 فقط داخل شبکه docker است

  # ─────────────────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricemonitor_celery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: worker
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - pricemonitor_media:/app/media
      - pricemonitor_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pricemonitor_net

  # ─────────────────────────────────────────────────────────
  # Celery Beat
  # ─────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricemonitor_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: beat
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - pricemonitor_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pricemonitor_net

  # ─────────────────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
    container_name: pricemonitor_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    networks:
      - pricemonitor_net
    depends_on:
      - backend

  # ─────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # تنها سرویس expose شده - پورت 8090
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pricemonitor_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pricemonitor_static:/app/staticfiles:ro
      - pricemonitor_media:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pricemonitor_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/v1/auth/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ─────────────────────────────────────────────────────────
# Networks - ایزوله از شبکه‌های دیگر
# ─────────────────────────────────────────────────────────
networks:
  pricemonitor_net:
    driver: bridge
    name: pricemonitor_network
    # نام صریح تا با شبکه‌های سایر پروژه‌ها تداخل نداشته باشد

# ─────────────────────────────────────────────────────────
# Volumes - با پیشوند pricemonitor_ برای جلوگیری از تداخل
# ─────────────────────────────────────────────────────────
volumes:
  pricemonitor_postgres_data:
    name: pricemonitor_postgres_data
  pricemonitor_redis_data:
    name: pricemonitor_redis_data
  pricemonitor_static:
    name: pricemonitor_static
  pricemonitor_media:
    name: pricemonitor_media
  pricemonitor_logs:
    name: pricemonitor_logs